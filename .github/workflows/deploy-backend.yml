name: CI/CD — Art Jatie Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Tests pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lancer les tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite://"
          JINA_API_KEY: "test"
          GOOGLE_API_KEY: "test"
          GROQ_API_KEY: "test"
          CLOUDFLARE_R2_BUCKET: "test"
          CLOUDFLARE_R2_ENDPOINT: "https://test.r2.cloudflarestorage.com"
          CLOUDFLARE_R2_ACCESS_KEY: "test"
          CLOUDFLARE_R2_SECRET_KEY: "test"
        run: pytest tests/ -v --tb=short

  build:
    name: Build & Push image Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/gitjaphet/artjatie-backend:latest
            ghcr.io/gitjaphet/artjatie-backend:${{ github.sha }}

  deploy:
    name: Deploy sur VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u gitjaphet --password-stdin
            cd /opt/artjatie
            docker compose pull backend
            docker compose up -d --no-deps backend
            sleep 10
            docker inspect artjatie_backend --format='{{.State.Health.Status}}' | grep -q healthy
            echo "Deploy réussi — $(date)"
